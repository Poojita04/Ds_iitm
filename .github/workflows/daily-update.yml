name: Daily Update by Poojita

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # THIS LINE MUST HAVE YOUR EXACT EMAIL
      - name: Poojita Mukundan (23f1002880@ds.study.iitm.ac.in) - Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add daily update
        run: |
          COUNTER_FILE="update-counter.txt"
          COUNTER=$(cat $COUNTER_FILE 2>/dev/null || echo "0")
          NEW_COUNTER=$((COUNTER + 1))
          echo $NEW_COUNTER > $COUNTER_FILE
          echo "# Daily Update #${NEW_COUNTER}" > STATUS.md
          echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> STATUS.md
          
          git config user.name "Daily Bot"
          git config user.email "23f1002880@ds.study.iitm.ac.in"
          git add STATUS.md $COUNTER_FILE
          git commit -m "Daily update #${NEW_COUNTER}: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" --allow-empty
          git push
