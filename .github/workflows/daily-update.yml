name: Daily Update by Poojita

on:
  schedule:
    # Runs daily at 2:30 AM UTC (specific time: minute 30, hour 2, any day/month/day-of-week)
    # Pick any specific hour/minute combo; this = once per day, not wildcards like *
    - cron: '30 2 * * *'
  # Lets you test manually without waiting 24h
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Step with your exact email in the name (required)
      - name: Poojita Mukundan (23f1002880@ds.study.iitm.ac.in) - Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Create a small change: update a status file with today's date
      - name: Add daily update
        run: |
          echo "# Daily automated update on $(date -u '+%Y-%m-%d %H:%M UTC')" > STATUS.md
          git config user.name "Daily Bot"
          git config user.email "23f1002880@ds.study.iitm.ac.in"
          git add STATUS.md
          git commit -m "Daily update: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"

      # Push the commit back (uses the token for permissions)
      - name: Push changes
        run: |
          git push

