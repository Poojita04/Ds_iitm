name: CI  # Name your workflow (shows in Actions tab)

on:
  push:
    branches: [ main ]  # Triggers on pushes to main
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger (key for testing)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Success step
      run: echo "Workflow passed!"
